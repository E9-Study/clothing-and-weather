<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Let's Practice the Clothing! - ESL Weather Dress-Up Game</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Kid-friendly rounded fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-display: 'Fredoka', sans-serif;
      --font-body: 'Nunito', sans-serif;
    }

    body {
      font-family: var(--font-body);
      user-select: none;
      -webkit-user-select: none;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    h1, h2, h3, .font-kid {
      font-family: var(--font-display);
    }

    /* Slide-authentic thick cartoon borders */
    .cartoon-box {
      border: 3px solid #111827;
      box-shadow: 0 5px 0 rgba(17, 24, 39, 0.18);
    }
    @media (min-width: 640px) {
      .cartoon-box {
        border: 4px solid #111827;
        box-shadow: 0 8px 0 rgba(17, 24, 39, 0.18);
      }
    }

    .cartoon-pill {
      border: 2px solid #111827;
      box-shadow: 0 2px 0 #111827;
      transition: all 0.15s ease;
    }
    @media (min-width: 640px) {
      .cartoon-pill {
        border: 2.5px solid #111827;
        box-shadow: 0 3px 0 #111827;
      }
    }

    .cartoon-pill:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #111827;
    }

    /* Animated Weather Elements */
    @keyframes sunSpin {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.08); }
      100% { transform: rotate(360deg) scale(1); }
    }
    .animate-sun {
      animation: sunSpin 20s linear infinite;
    }

    @keyframes sunPulse {
      0%, 100% { opacity: 0.45; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.18); }
    }
    .sun-glow {
      animation: sunPulse 2.4s ease-in-out infinite;
    }

    @keyframes rainFall {
      0% { transform: translateY(-40px) translateX(18px) rotate(16deg); opacity: 0; }
      15% { opacity: 0.95; }
      90% { opacity: 0.95; }
      100% { transform: translateY(580px) translateX(-110px) rotate(16deg); opacity: 0; }
    }
    .raindrop {
      animation: rainFall 0.85s linear infinite;
    }

    @keyframes puddleSplash {
      0%, 100% { transform: scale(0.3); opacity: 0; }
      50% { transform: scale(1.15); opacity: 0.85; }
    }
    .rain-splash {
      animation: puddleSplash 0.85s ease-out infinite;
    }

    @keyframes snowFall {
      0% { transform: translateY(-30px) translateX(0px) rotate(0deg); opacity: 0; }
      15% { opacity: 1; }
      50% { transform: translateY(270px) translateX(22px) rotate(180deg); opacity: 0.95; }
      100% { transform: translateY(570px) translateX(-18px) rotate(360deg); opacity: 0.2; }
    }
    .snowflake {
      animation: snowFall 3.1s linear infinite;
      filter: drop-shadow(0 2px 3px rgba(15, 23, 42, 0.35));
    }

    @keyframes windFlow {
      0% { transform: translateX(-60px) scaleX(0.92); opacity: 0.25; }
      50% { transform: translateX(35px) scaleX(1.06); opacity: 0.95; }
      100% { transform: translateX(110px) scaleX(0.95); opacity: 0.15; }
    }
    .wind-swirl {
      animation: windFlow 2.1s ease-in-out infinite;
    }

    @keyframes leafBlow {
      0% { transform: translate(-60px, 20px) rotate(0deg); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translate(920px, -70px) rotate(540deg); opacity: 0; }
    }
    .wind-leaf {
      animation: leafBlow 3.2s linear infinite;
    }

    @keyframes treeSway {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(4.5deg) translateX(8px); }
    }
    .tree-wind-sway {
      transform-origin: bottom center;
      animation: treeSway 1.8s ease-in-out infinite;
    }

    @keyframes cloudFloat {
      0%, 100% { transform: translateX(-18px); }
      50% { transform: translateX(26px); }
    }
    .cloud-drift {
      animation: cloudFloat 4.2s ease-in-out infinite;
    }

    /* Character Weather & Feedback Reactions */
    @keyframes shiverAnim {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px) rotate(-1.5deg); }
      40% { transform: translateX(6px) rotate(1.5deg); }
      60% { transform: translateX(-6px) rotate(-1.5deg); }
      80% { transform: translateX(6px) rotate(1.5deg); }
    }
    .react-shiver {
      animation: shiverAnim 0.28s ease-in-out infinite;
    }

    @keyframes sweatAnim {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(4px) scale(0.985, 1.015); }
    }
    .react-sweat {
      animation: sweatAnim 0.9s ease-in-out infinite;
    }

    @keyframes rainDuckAnim {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(5px) rotate(-2deg); }
    }
    .react-rain {
      animation: rainDuckAnim 0.75s ease-in-out infinite;
    }

    @keyframes windLeanAnim {
      0%, 100% { transform: rotate(2deg) translateX(4px); }
      50% { transform: rotate(6.5deg) translateX(12px); }
    }
    .react-wind {
      transform-origin: bottom center;
      animation: windLeanAnim 1.3s ease-in-out infinite;
    }

    @keyframes cloudyLookAnim {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-3px) rotate(-2.5deg); }
    }
    .react-cloudy {
      animation: cloudyLookAnim 1.8s ease-in-out infinite;
    }

    @keyframes happyBounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-12px) scale(1.03); }
    }
    .react-happy {
      animation: happyBounce 0.6s ease-in-out 3;
    }

    @keyframes thoughtPopIn {
      0% { transform: scale(0.3) translateY(15px); opacity: 0; }
      75% { transform: scale(1.06) translateY(-2px); opacity: 1; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    .thought-bubble-enter {
      animation: thoughtPopIn 0.38s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      transform-origin: bottom left;
    }

    @keyframes popOn {
      0% { transform: scale(0.6); opacity: 0; }
      70% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .clothing-layer-enter {
      animation: popOn 0.28s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      transform-origin: center center;
    }

    /* Guided Vocabulary Review Pulse Highlight */
    @keyframes vocabPulseGlow {
      0%, 100% { transform: scale(1.06); box-shadow: 0 0 0 4px #F59E0B, 0 10px 20px rgba(245, 158, 11, 0.35); }
      50% { transform: scale(1.13); box-shadow: 0 0 0 8px #FBBF24, 0 14px 26px rgba(245, 158, 11, 0.5); }
    }
    .vocab-review-active {
      animation: vocabPulseGlow 0.8s ease-in-out infinite;
      background-color: #FEF3C7 !important;
      z-index: 20;
    }

    /* Kawaii SVG Idle Breathing & Natural Blinking */
    @keyframes kawaiiFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .kawaii-idle {
      animation: kawaiiFloat 3.2s ease-in-out infinite;
      will-change: transform;
    }

    @keyframes kawaiiBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.08); }
    }
    .kawaii-eyes-blink {
      animation: kawaiiBlink 4.2s infinite;
      transform-box: fill-box;
      transform-origin: center center;
    }

    .raindrop, .snowflake, .wind-swirl, .wind-leaf, .cloud-drift {
      will-change: transform, opacity;
    }

    /* Dragging state highlight */
    .drop-zone-active {
      outline: 4px dashed #F59E0B;
      outline-offset: 6px;
      background-color: rgba(254, 243, 199, 0.35);
      border-radius: 24px;
    }

    /* Touch Drag Ghost */
    #touchDragGhost {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      width: 84px;
      height: 84px;
      transform: translate(-50%, -50%);
      display: none;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.28));
    }

    /* Custom Scrollbar for small screens */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.4);
    }
    ::-webkit-scrollbar-thumb {
      background: #0284C7;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-slate-900 min-h-[100dvh] flex flex-col justify-between overflow-x-hidden">

  <!-- Floating Ghost Element for Desktop/Tablet Dragging -->
  <div id="touchDragGhost"></div>

  <!-- TOP NAVIGATION BAR (Stacked 3x2 buttons on Smartphones, Original Bar on Tablet/Desktop) -->
  <header class="bg-white border-b-3 sm:border-b-4 border-gray-900 px-2.5 sm:px-4 py-1.5 sm:py-2 shadow-md z-30 shrink-0">
    <div class="max-w-7xl mx-auto flex flex-col lg:flex-row lg:items-center lg:justify-between gap-1.5 sm:gap-2">
      
      <!-- Top Row: Game Title + Voice Toggle + Star Counter -->
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-amber-300 border-2 border-gray-900 flex items-center justify-center shadow-sm shrink-0">
            <svg viewBox="0 0 24 24" class="w-4 h-4 sm:w-5 sm:h-5 text-gray-900" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/>
            </svg>
          </div>
          <div class="truncate">

            <svg viewBox="0 0 24 24" class="w-4 h-4 text-sky-900" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
            </svg>
            <span id="starCountText">0 / 6</span>
          </div>
        </div>
      </div>

      <!-- 6 Slide Tabs: Stacked 3x2 Grid on Smartphones, Flex Row on Tablet/Desktop -->
      <nav id="slideNav" class="grid grid-cols-3 sm:flex sm:flex-wrap items-center justify-center gap-1 sm:gap-1.5 w-full lg:w-auto">
        <!-- Populated dynamically by JS -->
      </nav>
    </div>
  </header>

  <!-- MAIN STAGE CONTAINER (Full-featured stage on Computer/Tablet, slightly more compact on Smartphones) -->
  <main class="flex-1 flex items-center justify-center p-1.5 sm:p-3 md:p-4 overflow-y-auto">
    <div id="stageWrapper" class="relative w-full max-w-6xl min-h-[480px] sm:min-h-[540px] lg:min-h-[580px] rounded-2xl sm:rounded-3xl cartoon-box overflow-hidden flex flex-col justify-between transition-colors duration-500">
      
      <!-- Dynamic Sky / Weather Background Decorations (Sun, Clouds, Rain, Snow, Wind) -->
      <div id="weatherSkyLayer" class="absolute inset-0 pointer-events-none overflow-hidden z-0"></div>

      <!-- Ground Layer (Green Grass or White Snow) -->
      <div id="groundLayer" class="absolute bottom-0 left-0 right-0 h-16 sm:h-28 border-t-4 border-gray-900 z-0 transition-colors duration-500" style="background-color: #2E9B47;"></div>

      <!-- Foreground Content Area -->
      <div id="screenContent" class="relative z-10 flex-1 flex flex-col justify-between p-2 sm:p-4 md:p-5">
        <!-- Rendered by JS for either Screen 1 (Vocab) or Screens 2-6 (Dress-Up) -->
      </div>

      <!-- Confetti Canvas Overlay -->
      <canvas id="confettiCanvas" class="absolute inset-0 pointer-events-none z-40 w-full h-full"></canvas>
    </div>
  </main>

  <!-- FOOTER BAR WITH QUICK TIPS -->
  <footer class="hidden sm:block bg-slate-800 text-slate-300 text-xs py-1.5 px-3 text-center border-t border-slate-700 shrink-0">
    <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-center gap-2">
      <span><strong>Tip:</strong> Tap any clothing card to hear it! In Dress-Up levels, <strong>tap or drag</strong> clothes onto the child.</span>
    </div>
  </footer>

  <!-- COMPLETE APPLICATION LOGIC & SVG ARTWORK LIBRARY -->
  <script>
    /*************************************************************************
     * 1. SOUND & SPEECH ENGINE (Web Speech API + Synthesized Sound Effects)
     *************************************************************************/
    let voiceEnabled = true;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSound(type) {
      try {
        initAudio();
        if (!audioCtx) return;
        const now = audioCtx.currentTime;

        if (type === 'pop') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(380, now);
          osc.frequency.exponentialRampToValueAtTime(720, now + 0.09);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.1);
        } else if (type === 'success') {
          const notes = [523.25, 659.25, 783.99];
          notes.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.07);
            gain.gain.setValueAtTime(0.16, now + idx * 0.07);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.22);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.07);
            osc.stop(now + idx * 0.07 + 0.23);
          });
        } else if (type === 'oops') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(250, now);
          osc.frequency.linearRampToValueAtTime(160, now + 0.25);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.27);
        } else if (type === 'fanfare') {
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.09);
            gain.gain.setValueAtTime(0.2, now + idx * 0.09);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.35);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.09);
            osc.stop(now + idx * 0.09 + 0.36);
          });
        }
      } catch (e) {
        // Ignore audio context errors on restricted devices
      }
    }

    let activeSpeechToken = 0;
    let speechQueueTimer = null;
    let isAudioSpeaking = false;
    // Prevent browser garbage collection from Prematurely destroying active SpeechSynthesisUtterance objects
    window._activeUtterance = null;

    function speakText(text, onEndCallback = null) {
      const myToken = ++activeSpeechToken;
      if (speechQueueTimer) {
        clearTimeout(speechQueueTimer);
        speechQueueTimer = null;
      }

      if (!voiceEnabled || !('speechSynthesis' in window)) {
        isAudioSpeaking = false;
        if (onEndCallback) {
          speechQueueTimer = setTimeout(() => {
            if (myToken === activeSpeechToken) onEndCallback();
          }, 1100);
        }
        return;
      }

      try {
        // Only cancel if speechSynthesis is actively speaking or pending, reducing engine lockups
        if (window.speechSynthesis.speaking || window.speechSynthesis.pending) {
          window.speechSynthesis.cancel();
        }
        if (window.speechSynthesis.paused) {
          window.speechSynthesis.resume();
        }
        isAudioSpeaking = true;

        speechQueueTimer = setTimeout(() => {
          if (myToken !== activeSpeechToken) return;

          const utter = new SpeechSynthesisUtterance(text);
          window._activeUtterance = utter;
          utter.lang = 'en-US';
          utter.rate = 0.82; // Slowed down for A1-A2 ESL beginners
          utter.pitch = 1.06; // Warm, friendly teacher voice

          let callbackFired = false;
          let backupTimer = null;

          const done = () => {
            if (callbackFired || myToken !== activeSpeechToken) return;
            callbackFired = true;
            if (backupTimer) {
              clearTimeout(backupTimer);
              backupTimer = null;
            }
            isAudioSpeaking = false;
            if (onEndCallback) onEndCallback();
          };

          // Guaranteed fallback timer so the game never hangs if a browser drops onend/onerror
          const estDuration = Math.max(1900, Math.min(6500, text.length * 115 + 950));
          backupTimer = setTimeout(done, estDuration);

          utter.onend = () => {
            setTimeout(done, 150);
          };

          utter.onerror = () => {
            // Always advance via done() if this is still the active speech token
            setTimeout(done, 200);
          };

          if (window.speechSynthesis.paused) {
            window.speechSynthesis.resume();
          }
          window.speechSynthesis.speak(utter);
        }, 80);
      } catch (e) {
        console.warn('Speech synthesis error:', e);
        isAudioSpeaking = false;
        if (onEndCallback) {
          setTimeout(() => {
            if (myToken === activeSpeechToken) onEndCallback();
          }, 1000);
        }
      }
    }

    function toggleVoice() {
      voiceEnabled = !voiceEnabled;
      const waves = document.getElementById('voiceWavesPath');
      if (waves) waves.style.display = voiceEnabled ? 'block' : 'none';
      document.getElementById('voiceLabel').textContent = voiceEnabled ? 'Voice ON' : 'Voice OFF';
      if (!voiceEnabled && 'speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      } else {
        speakText("Voice is on!");
      }
    }

    /*************************************************************************
     * 2. CUSTOM SVG CLOTHING & CHARACTER ARTWORK LIBRARY
     *    Every clothing item has a 'card' view (for wardrobe/vocab grids)
     *    and a 'worn' view mapped to our 260x440 child character coordinate space!
     *************************************************************************/

            <!-- Collar & Sleeve Stitch Lines -->
            <path d="M111,170 Q130,189 149,170" fill="none" stroke="#111827" stroke-width="2.2"/>
            <line x1="88" y1="202" x2="85" y2="168" stroke="#111827" stroke-width="2"/>
            <line x1="172" y1="202" x2="175" y2="168" stroke="#111827" stroke-width="2"/>
            <!-- Cute Brown Bear Face -->
            <circle cx="112" cy="204" r="9" fill="#A16207" stroke="#111827" stroke-width="2.4"/>
            <circle cx="112" cy="204" r="4.5" fill="#D97706"/>
            <circle cx="148" cy="204" r="9" fill="#A16207" stroke="#111827" stroke-width="2.4"/>
            <circle cx="148" cy="204" r="4.5" fill="#D97706"/>
            <ellipse cx="130" cy="218" rx="20" ry="18" fill="#A16207" stroke="#111827" stroke-width="2.5"/>
            <ellipse cx="130" cy="223" rx="8.5" ry="6.5" fill="#FDE68A" stroke="#111827" stroke-width="1.8"/>
            <circle cx="123" cy="213" r="2.5" fill="#111827"/>
            <circle cx="137" cy="213" r="2.5" fill="#111827"/>
            <ellipse cx="130" cy="221" rx="3" ry="2.2" fill="#111827"/>
            <path d="M127,225 Q130,228 133,225" fill="none" stroke="#111827" stroke-width="1.8" stroke-linecap="round"/>
          </g>`
      },

      long_sleeve_combo: {
        id: 'long_sleeve_combo',
        name: 'long-sleeved shirt',
        slot: 'top',
        sentence: "Long-sleeved shirt! Long sleeves protect our arms in windy or rainy weather.",
        svg: (isWorn = false) => isWorn ? `
          <g class="clothing-art">
            <defs>
              <clipPath id="clipStripedShirtCombo">
                <path d="M86,168 L32,232 L50,246 L90,202 L88,270 Q130,275 172,270 L170,202 L210,246 L228,232 L174,168 Q150,172 146,168 Q130,182 114,168 Q110,172 86,168 Z"/>
              </clipPath>
            </defs>
            <g clip-path="url(#clipStripedShirtCombo)">

        shoes: null,
        accessory: null,

      thoughtBubbleVisible = false;
      activeVocabBannerHTML = null;

      renderNavigation();
      updateStarCounter();

    function renderNavigation() {
      const nav = document.getElementById('slideNav');
      if (!nav) return;
      nav.innerHTML = LEVELS.map((lvl, idx) => {
        const isActive = idx === currentSlideIndex;
        const isDone = completedLevels.has(lvl.id);
        return `
          <button
            onclick="switchSlide(${idx})"
            class="cartoon-pill px-1.5 sm:px-3 py-0.5 sm:py-1 rounded-lg sm:rounded-xl text-[11px] sm:text-sm font-extrabold flex items-center justify-center gap-1 w-full sm:w-auto truncate transition-colors ${

      let bannerTextHTML = activeVocabBannerHTML || `Tap any piece of clothing to hear its name and sentence!`;
      if (vocabQuizState === 'reviewing') {

          <span class="inline-flex items-center gap-1.5 sm:gap-2 text-indigo-950 font-extrabold text-xs sm:text-lg">
            <span class="px-2.5 py-0.5 rounded-full bg-amber-300 border-2 border-gray-900 text-[10px] sm:text-sm font-black">

            </span>

          </span>
        `;
      } else if (vocabQuizState === 'quizzing' && vocabQuizTarget) {

        if (vocabQuizPraiseText) {

            <span class="inline-flex flex-wrap items-center gap-1.5 sm:gap-2 text-emerald-800 font-extrabold text-xs sm:text-lg">
              <span class="px-2 py-0.5 rounded-full bg-emerald-200 border-2 border-gray-900 text-[10px] sm:text-xs font-black">
                Found ${vocabQuizFound.size} / ${lvl.vocabItems.length}
              </span>
              <span>${vocabQuizPraiseText}</span>
            </span>

        } else {
          bannerTextHTML = `
            <span class="inline-flex flex-wrap items-center gap-1.5 sm:gap-2 text-indigo-950 text-xs sm:text-lg">
              <span class="px-2 py-0.5 rounded-full bg-indigo-200 border-2 border-gray-900 text-[10px] sm:text-xs font-black">

      } else if (vocabQuizState === 'completed') {

          <span class="text-emerald-800 font-extrabold text-xs sm:text-lg">

              <button onclick="startVocabQuizPrompt()" class="cartoon-pill bg-amber-400 hover:bg-amber-300 text-gray-900 px-2.5 sm:px-3.5 py-0.5 sm:py-1.5 rounded-lg sm:rounded-xl text-[11px] sm:text-sm font-extrabold flex items-center gap-1">
                <span>"Find It!" Quiz</span>
              </button>
            ` : `
              <button onclick="stopVocabQuizAndRender()" class="cartoon-pill bg-rose-500 hover:bg-rose-400 text-white px-2.5 py-0.5 sm:py-1.5 rounded-lg sm:rounded-xl text-[11px] sm:text-sm font-extrabold flex items-center gap-1">

          <div class="flex items-center gap-1.5 text-[11px] sm:text-base font-bold text-gray-800 leading-tight">

            ${vocabQuizState === 'reviewing' ? `
              <button onclick="advanceVocabReviewStepManually()" class="cartoon-pill bg-sky-200 hover:bg-sky-300 px-2 py-0.5 sm:px-2.5 sm:py-1 rounded-lg text-[10px] sm:text-xs font-extrabold text-gray-900">
                Next Word
              </button>
              <button onclick="beginVocabQuizPhase()" class="cartoon-pill bg-amber-300 hover:bg-amber-200 px-2 py-0.5 sm:px-2.5 sm:py-1 rounded-lg text-[10px] sm:text-xs font-extrabold text-gray-900">
                Skip Review
              </button>
            ` : ''}
            ${vocabQuizState === 'quizzing' && vocabQuizTarget ? `
              <button onclick="speakText('Find the ' + CLOTHING_DB[vocabQuizTarget].name)" class="cartoon-pill bg-sky-200 hover:bg-sky-300 px-2 py-0.5 sm:px-2.5 sm:py-1 rounded-lg text-[10px] sm:text-xs font-extrabold text-gray-900">
                Repeat Word
              </button>
            ` : ''}
          </div>
        </div>

        <!-- Main Split Layout: Girl on Left, White Framed Board on Right (Fits 3 rows of 4/4/3 on Mobile without scrolling!) -->
        <div class="flex-1 min-h-0 grid grid-cols-1 lg:grid-cols-12 gap-2 sm:gap-4 items-stretch lg:items-end">

          <div class="hidden lg:flex lg:col-span-3 h-full items-end justify-center">

            <!-- Row 1 (4 items) -->
            <div class="grid grid-cols-4 gap-1 sm:gap-2">
              ${row1.map((id, i) => renderVocabCard(id, i)).join('')}
            </div>
            <!-- Row 2 (4 items) -->
            <div class="grid grid-cols-4 gap-1 sm:gap-2">
              ${row2.map((id, i) => renderVocabCard(id, i + 4)).join('')}
            </div>
            <!-- Row 3 (3 footwear items centered) -->
            <div class="grid grid-cols-3 gap-1 sm:gap-2 max-w-2xl mx-auto w-full">
              ${row3.map((id, i) => renderVocabCard(id, i + 8)).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function updateMiaVocabPreview(itemId) {
      const item = CLOTHING_DB[itemId];
      if (!item) return;
      vocabPreviewOutfit = {
        top: null, outerwear: null, bottom: null, dress: null,
        socks: null, shoes: 'sandals_blue', accessory: null, headwear: null
      };
      if (item.slot === 'dress') {
        vocabPreviewOutfit.dress = itemId;
      } else if (item.slot === 'top' || item.slot === 'outerwear') {
        vocabPreviewOutfit[item.slot] = itemId;
        vocabPreviewOutfit.bottom = 'skirt_floral';
      } else if (item.slot === 'bottom') {
        vocabPreviewOutfit.top = 'tshirt_bear';
        vocabPreviewOutfit.bottom = itemId;
      } else {
        vocabPreviewOutfit.dress = 'dress_ruffle_yellow';
        vocabPreviewOutfit[item.slot] = itemId;
      }
    }

    function handleVocabClick(itemId) {
      const item = CLOTHING_DB[itemId];
      if (!item) return;

      // Ignore manual card clicks while automatic review or quiz intro is running
      if (vocabQuizState === 'reviewing' || vocabQuizState === 'quiz_intro' || vocabQuizState === 'completed') return;

      updateMiaVocabPreview(itemId);
      characterReaction = 'happy';

      // Check if we are in the active "Find It!" Quiz phase
      if (vocabQuizState === 'quizzing' && vocabQuizTarget) {
        // Ignore clicks during the brief praise transition between items
        if (vocabQuizPraiseText) return;

        if (itemId === vocabQuizTarget) {
          playSound('success');
          vocabQuizFound.add(itemId);

          // Did the player find all 11 items?
          if (vocabQuizQueue.length === 0) {
            vocabQuizState = 'completed';
            vocabQuizTarget = null;
            completedLevels.add(1);
            updateStarCounter();
            renderNavigation();
            renderScreenContent(LEVELS[0]);
            playSound('fanfare');
            launchConfetti();
            speakText("Amazing job! You found all the clothing! Let's play the weather dress-up game!", () => {
              if (currentSlideIndex === 0 && vocabQuizState === 'completed') {
                vocabFlowTimer = setTimeout(() => {
                  switchSlide(1);
                }, 1000);
              }
            });
            return;
          }

          // Step 1: Praise the student for finding the item
          vocabQuizPraiseText = `Great job! That is the ${item.name}!`;
          renderScreenContent(LEVELS[0]);

          speakText(`Great job!`, () => {
            if (currentSlideIndex !== 0 || vocabQuizState !== 'quizzing') return;
            // Step 2: Pause briefly so A1 beginners can process, then show & speak "Find the (next clothing)"
            vocabFlowTimer = setTimeout(() => {
              if (currentSlideIndex !== 0 || vocabQuizState !== 'quizzing') return;
              vocabQuizPraiseText = null;
              vocabQuizTarget = vocabQuizQueue.shift();
              characterReaction = 'normal';
              renderScreenContent(LEVELS[0]);
              const nextName = CLOTHING_DB[vocabQuizTarget].name;
              speakText(`Find the ${nextName}`);
            }, 650);
          });
        } else {
          playSound('oops');
          const cardEl = document.getElementById(`vocabCard_${itemId}`);
          if (cardEl) {
            cardEl.classList.add('ring-4', 'ring-rose-400', 'bg-rose-50');
            setTimeout(() => cardEl.classList.remove('ring-4', 'ring-rose-400', 'bg-rose-50'), 650);
          }
          const targetName = CLOTHING_DB[vocabQuizTarget].name;
          const bannerEl = document.getElementById('vocabBannerText');
          if (bannerEl) {
            bannerEl.innerHTML = `
              <span class="inline-flex flex-wrap items-center gap-2 text-rose-700 font-extrabold text-sm sm:text-lg">
                <span>That is the <strong>${item.name}</strong>.</span>
                <span class="text-indigo-950">Find the <strong class="underline text-indigo-700 font-black uppercase px-1.5 py-0.5 bg-amber-200 rounded border border-gray-900">${targetName}</strong>!</span>
              </span>
            `;
          }
          speakText(`That is the ${item.name}.`, () => {
            if (currentSlideIndex !== 0 || vocabQuizState !== 'quizzing' || !vocabQuizTarget) return;
            vocabFlowTimer = setTimeout(() => {
              if (currentSlideIndex !== 0 || vocabQuizState !== 'quizzing' || !vocabQuizTarget) return;
              renderScreenContent(LEVELS[0]);
              speakText(`Find the ${CLOTHING_DB[vocabQuizTarget].name}`);
            }, 550);
          });
        }
        return;
      }

      // Standard Explore Mode: Keep the spoken sentence visible in the banner the entire time audio plays!
      activeVocabBannerHTML = `
        <span class="inline-flex flex-wrap items-center gap-2">
          <strong class="text-sky-700 uppercase font-black">${item.name}:</strong>
          <span class="text-gray-900 font-extrabold">"${item.sentence}"</span>
        </span>
      `;
      renderScreenContent(LEVELS[currentSlideIndex]);

      const cardEl = document.getElementById(`vocabCard_${itemId}`);
      if (cardEl) {
        cardEl.classList.add('ring-4', 'ring-amber-400', 'bg-amber-50');
      }

      playSound('pop');
      if (bounceTimeout) clearTimeout(bounceTimeout);

      speakText(item.sentence, () => {
        // Keep sentence visible after audio finishes, only relax character pose & card ring
        characterReaction = 'normal';
        const activeCard = document.getElementById(`vocabCard_${itemId}`);
        if (activeCard) {
          activeCard.classList.remove('ring-4', 'ring-amber-400', 'bg-amber-50');
        }
      });
    }

    function toggleVocabLabels() {
      hideVocabLabels = !hideVocabLabels;
      renderScreenContent(LEVELS[currentSlideIndex]);
    }

    function stopVocabQuizAndRender() {
      stopVocabQuizFlow();
      renderScreenContent(LEVELS[0]);
    }

    // Starts Phase 1: Guided Review of all 11 clothing items out loud with pulsing highlight & student practice pause
    function startVocabQuizPrompt() {
      stopVocabQuizFlow();
      const sessionId = ++vocabFlowSessionId;
      vocabQuizState = 'reviewing';
      vocabReviewIndex = 0;
      vocabReviewSubphase = 'listen';
      playSound('pop');
      runNextVocabReviewStep(sessionId);
    }

    function advanceVocabReviewStepManually() {
      if (currentSlideIndex !== 0 || vocabQuizState !== 'reviewing') return;
      if (vocabFlowTimer) {
        clearTimeout(vocabFlowTimer);
        vocabFlowTimer = null;
      }
      activeSpeechToken++;
      const sessionId = ++vocabFlowSessionId;
      vocabReviewIndex++;
      runNextVocabReviewStep(sessionId);
    }

    function runNextVocabReviewStep(sessionId = vocabFlowSessionId) {
      if (currentSlideIndex !== 0 || vocabQuizState !== 'reviewing' || sessionId !== vocabFlowSessionId) return;
      const lvl = LEVELS[0];

      if (vocabReviewIndex >= lvl.vocabItems.length) {
        beginVocabQuizPhase();
        return;
      }

      const itemId = lvl.vocabItems[vocabReviewIndex];
      const item = CLOTHING_DB[itemId];
      vocabReviewSubphase = 'listen';
      updateMiaVocabPreview(itemId);
      characterReaction = 'happy';
      renderScreenContent(lvl);

      // Ensure pulsed card is visible on small mobile screens
      const cardEl = document.getElementById(`vocabCard_${itemId}`);
      if (cardEl && window.innerWidth < 640) {
        cardEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      playSound('pop');
      speakText(item.name, () => {
        if (currentSlideIndex !== 0 || vocabQuizState !== 'reviewing' || sessionId !== vocabFlowSessionId) return;
        // Switch banner to "Your turn! Say: [item.name]" and pause 2.1 seconds so A1 beginners can repeat out loud
        vocabReviewSubphase = 'repeat';
        characterReaction = 'normal';
        renderScreenContent(lvl);

        vocabFlowTimer = setTimeout(() => {
          if (currentSlideIndex !== 0 || vocabQuizState !== 'reviewing' || sessionId !== vocabFlowSessionId) return;
          vocabReviewIndex++;
          runNextVocabReviewStep(sessionId);
        }, 2100);
      });
    }

    // Starts Phase 2: Announces "Quiz time!", pauses, and then prompts "Find the + (clothing)" for each item
    function beginVocabQuizPhase() {
      // Increment session ID and clear any active review timers/speech so old review callbacks cannot interfere
      const sessionId = ++vocabFlowSessionId;
      if (vocabFlowTimer) {
        clearTimeout(vocabFlowTimer);
        vocabFlowTimer = null;
      }
      if (speechQueueTimer) {
        clearTimeout(speechQueueTimer);
        speechQueueTimer = null;
      }
      activeSpeechToken++;

      const lvl = LEVELS[0];
      vocabReviewIndex = -1;
      vocabReviewSubphase = 'listen';
      vocabQuizFound.clear();
      vocabQuizPraiseText = null;

      // Fisher-Yates shuffle of all 11 vocabulary items
      const shuffled = [...lvl.vocabItems];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }

      vocabQuizTarget = shuffled.shift();
      vocabQuizQueue = shuffled;
      vocabQuizState = 'quiz_intro';
      characterReaction = 'normal';
      playSound('fanfare');
      renderScreenContent(lvl);

      let quizStarted = false;
      const startFirstQuestion = () => {
        if (quizStarted || currentSlideIndex !== 0 || sessionId !== vocabFlowSessionId) return;
        quizStarted = true;
        vocabQuizState = 'quizzing';
        renderScreenContent(lvl);
        const targetName = CLOTHING_DB[vocabQuizTarget].name;
        speakText(`Find the ${targetName}`);
      };

      // Safety fallback so skipping review ALWAYS enters the quiz even if browser TTS hiccups
      vocabFlowTimer = setTimeout(startFirstQuestion, 2300);

      // First say "Quiz time!", then pause 800ms so students clearly hear "Find the [clothing]!"
      speakText("Quiz time!", () => {
        if (currentSlideIndex !== 0 || sessionId !== vocabFlowSessionId) return;
        if (vocabFlowTimer) clearTimeout(vocabFlowTimer);
        vocabFlowTimer = setTimeout(startFirstQuestion, 800);
      });
    }

    /*************************************************************************
     * 8. SCREENS 2–6: INTERACTIVE WEATHER DRESS-UP RENDERER & MECHANICS
     *************************************************************************/
    function renderDressUpScreen(container, lvl) {
      const status = lvl.checkComplete(wornOutfit);
      const isManyItems = lvl.wardrobe.length > 8; // e.g., Level 4 Snowy has 9 items

      // Build list of currently worn items so player can also see/remove them with one click
      const wornList = Object.entries(wornOutfit)
        .filter(([_, id]) => Boolean(id))
        .map(([slot, id]) => ({ slot, ...CLOTHING_DB[id] }));

      // Only show the hint or feedback if the player has failed or completed the outfit
      let feedbackBannerHTML = '';
      if (feedbackMessage && (feedbackMessage.type === 'error' || feedbackMessage.type === 'win')) {
        feedbackBannerHTML = `
          <div class="mb-1 px-3 py-1 rounded-2xl border-2 border-gray-900 text-xs sm:text-sm font-extrabold shadow-md max-w-xs text-center z-30 ${
            feedbackMessage.type === 'error'
              ? 'bg-rose-100 text-rose-900 animate-bounce'
              : 'bg-emerald-200 text-emerald-950'
          }">
            ${feedbackMessage.text}
          </div>
        `;
      } else if (hasFailedCurrentLevel && !status.isComplete) {
        feedbackBannerHTML = `
          <div class="mb-1 px-3 py-1 rounded-full bg-amber-100/95 border-2 border-gray-900 text-xs font-extrabold text-gray-900 shadow-sm z-30">
            Hint: ${status.missingHint}
          </div>
        `;
      }

      // Responsive Grid: Compact 4 or 5 columns on smartphones (<640px) so it takes only 2 rows,
      // and original spacious 3/4/5 columns on tablets and computers (sm: and md:)
      const gridColsClass = isManyItems
        ? 'grid-cols-5 sm:grid-cols-3 md:grid-cols-5 gap-1.5 sm:gap-2'
        : 'grid-cols-4 sm:grid-cols-3 md:grid-cols-4 gap-1.5 sm:gap-2.5';

      const cardIconSizeClass = isManyItems
        ? 'w-12 h-12 sm:w-20 sm:h-20 md:w-22 md:h-22'
        : 'w-14 h-14 sm:w-24 sm:h-24';

      container.innerHTML = `
        <!-- Main Split Area: Child + Speech Bubble on Left, Instruction + Wardrobe on Right -->
        <div class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-2 sm:gap-4 items-end my-auto">
          
          <!-- Left Column: Interactive Child Character with Speech Bubble Anchored Directly Next to Head -->
          <div class="lg:col-span-5 flex flex-col items-center justify-end h-full relative">

            <!-- Dynamic Pedagogical Feedback / Hint (Only appears after failing or winning) -->
            ${feedbackBannerHTML}

            <!-- Character SVG Container (Drop Target) with Explicit Responsive Height so SVG Never Collapses -->
            <div
              id="characterDropZone"
              ondragover="handleDragOver(event)"
              ondragleave="handleDragLeave(event)"
              ondrop="handleDropOnChild(event)"
              class="relative w-40 sm:w-56 md:w-60 h-52 sm:h-80 lg:h-[350px] flex items-end justify-center transition-all p-1"
            >
              ${thoughtBubbleVisible ? `
                <div
                  onclick="playWeatherIntroSequence(LEVELS[currentSlideIndex])"
                  title="Click to hear again!"
                  class="thought-bubble-enter cursor-pointer group absolute top-[6%] left-[64%] sm:left-[68%] z-30 bg-white border-3 sm:border-4 border-gray-900 rounded-2xl sm:rounded-3xl px-2.5 sm:px-4 py-1 sm:py-2 shadow-[4px_5px_0_#FDE047] hover:scale-105 transition-transform w-max max-w-[135px] sm:max-w-[195px]"
                >
                  <p class="font-kid text-xs sm:text-lg md:text-xl font-bold text-gray-900 text-center leading-tight">
                    ${lvl.thoughtHtml}
                  </p>
                  <!-- Direct Speech Pointer Tail Pointing to the Character's Mouth/Cheek -->
                  <svg viewBox="0 0 32 24" class="absolute top-1/2 -left-[18px] sm:-left-[20px] -translate-y-1/2 w-5 h-4 sm:w-6 sm:h-5 overflow-visible pointer-events-none">
                    <path d="M24,2 L2,14 L24,20 Z" fill="#FFFFFF" stroke="#111827" stroke-width="4" stroke-linejoin="round"/>
                    <path d="M22,4 L26,4 L26,18 L22,18 Z" fill="#FFFFFF"/>
                  </svg>
                </div>
              ` : ''}

              ${renderDressUpCharacterSVG(lvl.characterType, wornOutfit, characterReaction)}
            </div>

            <!-- Currently Worn Pills (Click to remove individual item) -->
            <div class="min-h-[24px] sm:min-h-[26px] flex flex-wrap items-center justify-center gap-1 mt-0.5">
              ${wornList.length === 0
                ? `<span class="text-[11px] sm:text-xs font-bold text-white bg-gray-900/65 px-2.5 py-0.5 rounded-full">Tap or drag clothes onto ${lvl.characterName}</span>`
                : wornList.map(item => `
                    <button onclick="removeWornSlot('${item.slot}')" class="bg-white/95 hover:bg-rose-100 text-gray-900 border-2 border-gray-900 rounded-full px-2 py-0.5 text-[11px] sm:text-xs font-bold flex items-center gap-1 shadow-sm" title="Tap to remove">
                      <span>${item.name}</span>
                      <span class="text-rose-600 font-black">x</span>
                    </button>
                  `).join('')
              }
            </div>
          </div>

          <!-- Right Column: Instruction Text + White Wardrobe Box + Big Reset Icon Button -->
          <div class="lg:col-span-7 flex flex-col justify-end gap-1.5 sm:gap-2">
            
            <!-- Instruction Row above Wardrobe Box -->
            <div class="flex items-center justify-between gap-2.5 bg-white/95 border-2 sm:border-3 border-gray-900 rounded-xl sm:rounded-2xl px-3 sm:px-3.5 py-1.5 sm:py-2 shadow-sm">
              <p class="font-extrabold text-gray-900 text-xs sm:text-base leading-snug">
                ${lvl.instruction}
              </p>

              <!-- Big, Obvious Icon-Only Reset Button -->
              <button
                onclick="clearOutfit()"
                aria-label="Reset Outfit"
                title="Reset Outfit"
                class="cartoon-pill shrink-0 w-9 h-9 sm:w-12 sm:h-12 rounded-full bg-rose-500 hover:bg-rose-400 active:bg-rose-600 text-white flex items-center justify-center shadow-md hover:rotate-[-25deg] transition-transform"
              >
                <svg viewBox="0 0 24 24" class="w-5 h-5 sm:w-7 sm:h-7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/>
                  <path d="M3 3v5h5"/>
                </svg>
              </button>
            </div>

            <!-- White Wardrobe Box -->
            <div class="bg-white cartoon-box rounded-xl p-2 sm:p-4 flex flex-col justify-between">
              <div class="grid ${gridColsClass} my-auto">
                ${lvl.wardrobe.map(itemId => {
                  const item = CLOTHING_DB[itemId];
                  const isCurrentlyWorn = Object.values(wornOutfit).includes(itemId);
                  return `
                    <div
                      draggable="true"
                      ondragstart="handleDragStart(event, '${itemId}')"
                      onclick="equipOrToggleItem('${itemId}')"
                      class="group cursor-pointer rounded-xl sm:rounded-2xl border-2 p-1 sm:p-2 flex flex-col items-center justify-between transition-all select-none touch-manipulation ${
                        isCurrentlyWorn
                          ? 'border-emerald-600 bg-emerald-50 ring-2 ring-emerald-400 scale-[0.98]'
                          : 'border-gray-200 hover:border-gray-900 hover:bg-sky-50 hover:-translate-y-0.5 active:scale-95'
                      }"
                    >
                      <div class="${cardIconSizeClass} flex items-center justify-center">
                        ${renderCardItemSVG(itemId)}
                      </div>
                      <div class="mt-0.5 flex items-center gap-1 w-full justify-center">
                        <span class="text-[10px] sm:text-xs md:text-sm font-bold text-gray-800 group-hover:text-gray-900 text-center leading-tight truncate">
                          ${item.name}
                        </span>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>

              <!-- Next Level Celebration Bar when Outfit is Complete -->
              ${status.isComplete ? `
                <div id="nextLevelBar" class="mt-2 sm:mt-2.5 bg-emerald-100 border-2 sm:border-3 border-emerald-800 rounded-xl p-2 sm:p-2.5 flex flex-wrap items-center justify-between gap-2 shadow-sm">
                  <div class="flex items-center gap-2">
                    <p class="font-kid font-bold text-emerald-950 text-xs sm:text-base">
                      Awesome Job! Perfect outfit for ${lvl.weatherKey} weather!
                    </p>
                  </div>
                  ${currentSlideIndex < LEVELS.length - 1 ? `
                    <button onclick="switchSlide(${currentSlideIndex + 1})" class="cartoon-pill bg-amber-400 hover:bg-amber-300 text-gray-900 px-3 sm:px-4 py-1 sm:py-1.5 rounded-xl font-extrabold text-xs sm:text-sm shrink-0">
                      Next Weather Level
                    </button>
                  ` : `
                    <button onclick="switchSlide(0)" class="cartoon-pill bg-amber-400 hover:bg-amber-300 text-gray-900 px-3 sm:px-4 py-1 sm:py-1.5 rounded-xl font-extrabold text-xs sm:text-sm shrink-0">
                      All Done! Back to Start
                    </button>
                  `}
                </div>
              ` : ''}
            </div>
          </div>
        </div>
      `;

      // If level just completed on a small mobile screen, smoothly ensure the Next Level bar is in view
      if (status.isComplete) {
        const nextBar = document.getElementById('nextLevelBar');
        if (nextBar && window.innerWidth < 768) {
          setTimeout(() => nextBar.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
        }
      }
    }

    /*************************************************************************
     * 9. EQUIP / DRAG-AND-DROP (MOUSE & MOBILE TAP) / WEATHER VALIDATION
     *************************************************************************/
    let draggedItemId = null;

    function hideTouchDragGhost() {
      const ghost = document.getElementById('touchDragGhost');
      if (ghost) {
        ghost.style.display = 'none';
        ghost.innerHTML = '';
      }
      const dz = document.getElementById('characterDropZone');
      if (dz) dz.classList.remove('drop-zone-active');
    }

    function handleDragStart(e, itemId) {
      draggedItemId = itemId;
      e.dataTransfer.setData('text/plain', itemId);
    }

    function handleDragOver(e) {
      e.preventDefault();
      const dz = document.getElementById('characterDropZone');
      if (dz) dz.classList.add('drop-zone-active');
    }

    function handleDragLeave(e) {
      const dz = document.getElementById('characterDropZone');
      if (dz) dz.classList.remove('drop-zone-active');
    }

    function handleDropOnChild(e) {
      e.preventDefault();
      const dz = document.getElementById('characterDropZone');
      if (dz) dz.classList.remove('drop-zone-active');
      const itemId = e.dataTransfer.getData('text/plain') || draggedItemId;
      if (itemId) {
        equipOrToggleItem(itemId, true);
      }
    }

    function equipOrToggleItem(itemId, forceEquip = false) {
      if (bounceTimeout) clearTimeout(bounceTimeout);
      hideTouchDragGhost();

      const lvl = LEVELS[currentSlideIndex];
      const item = CLOTHING_DB[itemId];
      if (!item) return;

      // Ensure thought bubble stays visible if user interacts quickly
      thoughtBubbleVisible = true;

      // If already worn and clicked (not dropped), take it off
      if (!forceEquip && wornOutfit[item.slot] === itemId) {
        wornOutfit[item.slot] = null;
        const anyWorn = Object.values(wornOutfit).some(Boolean);
        characterReaction = anyWorn ? 'normal' : getDefaultWeatherReaction(lvl.weatherKey);
        feedbackMessage = null;
        playSound('pop');
        renderScreenContent(lvl);
        return;
      }

      // Check if this item is inappropriate for the current weather
      const wrongReason = lvl.wrongReasons && lvl.wrongReasons[itemId];
      if (wrongReason) {
        // Mark that the player has failed at least once on this level so hints become visible!
        hasFailedCurrentLevel = true;
        // Put it on briefly so the child reacts (shivers/sweats) and explains why!
        wornOutfit[item.slot] = itemId;
        characterReaction = (lvl.weatherKey === 'sunny') ? 'sweat' : 'shiver';
        feedbackMessage = { type: 'error', text: wrongReason };
        playSound('oops');
        speakText(wrongReason);
        renderScreenContent(lvl);

        // Gently bounce the inappropriate item back to the wardrobe after 1.9 seconds
        bounceTimeout = setTimeout(() => {
          if (wornOutfit[item.slot] === itemId) {
            wornOutfit[item.slot] = null;
            const anyWorn = Object.values(wornOutfit).some(Boolean);
            characterReaction = anyWorn ? 'normal' : getDefaultWeatherReaction(lvl.weatherKey);
            feedbackMessage = null;
            renderScreenContent(lvl);
          }
        }, 1950);
        return;
      }

      // Handle Dress vs Top+Bottom exclusivity so outfits look clean
      if (item.slot === 'dress') {
        wornOutfit.top = null;
        wornOutfit.bottom = null;
      } else if (item.slot === 'top' || item.slot === 'bottom') {
        wornOutfit.dress = null;
      }

      // Equip valid item!
      wornOutfit[item.slot] = itemId;

      // Check if the full outfit for this weather level is now complete
      const status = lvl.checkComplete(wornOutfit);
      if (status.isComplete) {
        characterReaction = 'happy';
        feedbackMessage = {
          type: 'win',
          text: `Great job! The ${item.name} completes the ${lvl.weatherKey} weather outfit!`
        };
        completedLevels.add(lvl.id);
        updateStarCounter();
        renderNavigation();
        playSound('fanfare');
        launchConfetti();
        speakText(`Great job! ${item.name}! You dressed the child for ${lvl.weatherKey} weather!`);
      } else {
        characterReaction = 'normal';
        feedbackMessage = null;
        playSound('success');
        speakText(item.name);
      }

      renderScreenContent(lvl);
    }

    function removeWornSlot(slot) {
      const lvl = LEVELS[currentSlideIndex];
      const removedId = wornOutfit[slot];
      if (!removedId) return;
      wornOutfit[slot] = null;
      const anyWorn = Object.values(wornOutfit).some(Boolean);
      characterReaction = anyWorn ? 'normal' : getDefaultWeatherReaction(lvl.weatherKey);
      feedbackMessage = null;
      playSound('pop');
      renderScreenContent(lvl);
    }

    function clearOutfit() {
      const lvl = LEVELS[currentSlideIndex];
      wornOutfit = {
        top: null, outerwear: null, bottom: null, dress: null,
        socks: null, shoes: null, accessory: null, headwear: null
      };
      feedbackMessage = null;
      playSound('pop');
      playWeatherIntroSequence(lvl);
    }

    function resetAllProgress() {
      completedLevels.clear();
      switchSlide(0);
    }

    /*************************************************************************
     * 10. CELEBRATION CONFETTI ENGINE
     *************************************************************************/
    let confettiParticles = [];
    let confettiAnimId = null;

    function launchConfetti() {
      const canvas = document.getElementById('confettiCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;

      const colors = ['#FACC15', '#EF4444', '#3B82F6', '#10B981', '#EC4899', '#A855F7'];
      confettiParticles = Array.from({ length: 75 }).map(() => ({
        x: canvas.width / 2 + (Math.random() - 0.5) * 180,
        y: canvas.height * 0.45,
        vx: (Math.random() - 0.5) * 12,
        vy: -Math.random() * 12 - 4,
        size: Math.random() * 8 + 5,
        color: colors[Math.floor(Math.random() * colors.length)],
        rotation: Math.random() * 360,
        vRot: (Math.random() - 0.5) * 12
      }));

      if (confettiAnimId) cancelAnimationFrame(confettiAnimId);

      function step() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = false;
        confettiParticles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.35; // gravity
          p.rotation += p.vRot;
          if (p.y < canvas.height + 20) active = true;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rotation * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
          ctx.restore();
        });

        if (active) {
          confettiAnimId = requestAnimationFrame(step);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      step();
    }

    // Initialize on load
    window.onload = function () {
      switchSlide(0);
    };
  </script>
</body>
